name: CI — Tests, Lint & Type Check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  MONGODB_URI: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
  MONGO_URL: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
  JWT_SECRET: 'ci_test_secret_key_do_not_use_in_production'
  NODE_ENV: 'test'
  REDIS_URL: ''

jobs:
  quality-checks:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --exclude src/test/idempotency.test.js --exclude src/test/emailOutbox.test.js

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration-tests:
    name: Integration Tests (MongoDB)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      MONGO_URL: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      JWT_SECRET: 'ci_test_secret_key_do_not_use_in_production'
      NODE_ENV: 'test'
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Start MongoDB Replica Set
        run: |
          docker run --name mongodb -d -p 27017:27017 mongo:7 --replSet rs0
          sleep 5
          docker exec mongodb mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 2

      - name: Run integration tests
        run: npm test -- src/test/checkout.test.js src/test/idempotency.test.js src/test/emailOutbox.test.js

      - name: Run race & idempotency verification tests
        run: npm run test:race

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      MONGO_URL: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      JWT_SECRET: 'ci_test_secret_key_do_not_use_in_production'
      NODE_ENV: 'test'
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Start MongoDB Replica Set
        run: |
          docker run --name mongodb -d -p 27017:27017 mongo:7 --replSet rs0
          sleep 5
          docker exec mongodb mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 2

      - name: Build frontend
        run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      MONGO_URL: 'mongodb://127.0.0.1:27017/stopshop_test?replicaSet=rs0'
      JWT_SECRET: 'ci_test_secret_key_do_not_use_in_production'
      CUSTOMER_JWT_SECRET: 'ci_customer_test_secret_key_do_not_use'
      CI: 'true'
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start MongoDB Replica Set
        run: |
          docker run --name mongodb -d -p 27017:27017 mongo:7 --replSet rs0
          sleep 5
          docker exec mongodb mongosh --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 2

      - name: Seed Database
        run: node scripts/seed.js

      - name: Build Next.js Application
        run: npm run build
        env:
          CI: 'true'

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run audit
        run: npm audit --audit-level=high --legacy-peer-deps || true

